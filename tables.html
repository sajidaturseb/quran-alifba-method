<style>
:root{--ink:#143c32;--green:#18574a;--soft:#eef6f1;--gold:#b79a4c;--line:#d3e1d7}
*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:var(--ink);font:17px/1.5 Arial,sans-serif}
header{background:linear-gradient(135deg,#0e4238,#216f60);color:#fff;padding:20px 16px 24px}

.card{background:var(--card-bg,#fff);border:1px solid var(--card-line,var(--line));border-left:5px solid var(--card-accent,var(--gold));border-radius:15px;padding:16px;margin:0 0 11px;box-shadow:0 3px 12px #124f3510}

.card-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}.letters{font:700 28px/1.2 'Times New Roman',serif;direction:rtl;color:#104c3e}.letters.mixed{direction:ltr;font-size:21px}.letter-note{margin:0 0 8px 36px;font-size:14px;color:#42675b}.badge{background:#e6f2eb;border-radius:30px;color:#286954;padding:4px 9px;font:700 13px Arial}

.strength-card.s-mid{--card-bg:#faf0f1;--card-accent:#c8858e}

.letter-chip small{font:13px Arial;color:#536d62}
.source-note{font-size:14px;color:#596c64;margin-top:18px}
@media(max-width:420px){.view-tabs button{font-size:14px}.overview-card,.strength-card{padding:14px}.letter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

</style>

<script>const data={"tt": [["№", "Гомуми өлкә", "Аерым махраҗ", "Хәрефләр", "Аваз барлыкка килгән урын"], ["1", "Авыз һәм бугаз куышлыгы — Әл-Җәүф («الْجَوْفُ»)", "—", "ا، و، ي — мәддия хәрефләре", "Авыз белән бугазның буш куышлыгы."], ["2", "Бугаз — Әл-Хәлк («الْحَلْقُ»)", "Бугазның иң түбән өлеше — Аксаль-хәлк («أَقْصَى الْحَلْقِ»)", "ء، هـ", "Тавыш ярылары өлкәсе."], ["", "Бугаз — Әл-Хәлк («الْحَلْقُ»)", "Бугазның урта өлеше — Васатуль-хәлк («وَسَطُ الْحَلْقِ»)", "ع، ح", "Надгортанник — лисануль-мизмар («لِسَانُ الْمِزْمَارِ») өлкәсе. Безнең әсбаптан:  Хә әйтелгәндә мизмар бугазның арткы стенасына якыная; һава өчен тар гына ара кала."], ["", "Бугаз — Әл-Хәлк («الْحَلْقُ»)", "Бугазның өске өлеше — Әднәл-хәлк («أَدْنَى الْحَلْقِ»)", "غ، خ", "Тел тамыры — җәзруль-лисан («جَذْرُ اللِّسَانِ») өлкәсе. Безнең әсбаптан:  Гайн әйтелгәндә мизмар арткы стенага якыная, тел тамыры күтәрелә. Хада да тел тамыры күтәрелә; һава үтәрлек ара кала."], ["3", "Тел — Әл-Лисан («اللِّسَانُ»)", "Телнең иң арткы өлеше — Аксаль-лисан («أَقْصَى اللِّسَانِ»)", "ق", "Телнең иң арткы өлеше һәм аңа туры килгән йомшак аңкау — әл-хәнәк әл-ләхми («الْحَنَكُ اللَّحْمِيُّ»). Безнең әсбаптан:  Каф (ق) әйтелгәндә тел тамыры күтәрелеп, йомшак аңкауга терәлә."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Телнең иң арткы өлеше — Аксаль-лисан («أَقْصَى اللِّسَانِ»)", "ك", "Телнең иң арткы өлеше һәм аңа туры килгән өске аңкауның каты һәм йомшак өлешләре — әл-хәнәк әл-газми вә-л-ләхми («الْحَنَكُ الْعَظْمِيُّ وَاللَّحْمِيُّ»). Безнең әсбаптан:  Кәф (ك) әйтелгәндә телнең иң арткы өлеше йомшак аңкау янындагы каты аңкау өлешенә терәлә."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Телнең уртасы — Васатуль-лисан («وَسَطُ اللِّسَانِ»)", "ج، ش، ي (мәддия түгел)", "Тел уртасы һәм аңа туры килгән өске аңкау өлеше. Безнең әсбаптан:  Васатуль-лисән («وَسَطُ اللِّسَانِ»): Джимдә тел уртасы аңкауга нык терәлә; Шиндә һава үтәрлек ара кала; Йәдә тел уртасы күтәрелә, ләкин ябышмый."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Телнең ян кырые — Хаффатуль-лисан («حَافَّةُ اللِّسَانِ»)", "ض", "Телнең уң яки сул кырые, яисә ике кырые бергә, һәм аларга туры килгән өске зур азу тешләре. Безнең әсбаптан:  Дадта телнең ян кырыеның ерак өлеше — «акъса хаффатиль-лисан» («أَقْصَى حَافَّةِ اللِّسَانِ») — һәм урта өлеше — «васат хаффатиль-лисан» («وَسَطُ حَافَّةِ اللِّسَانِ») эшли. Тел очы аңкауга җиңелчә генә тия; тел тамыры күтәрелә."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Телнең ян кырые — Хаффатуль-лисан («حَافَّةُ اللِّسَانِ»)", "ل", "Ләм хәрефе тел кырыеның алгы өлеше — «أدنى حافة اللسان» («әдна хаффати-ль-лисән») — өске алгы сигез тешнең казналарына тигәндә ясала. Һава телнең ике кырыеннан чыга. Ләмне әйткәндә телгә артык басым ясамыйбыз."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Тел очы — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ن", "Нун хәрефенең ясалуында „тарафуль-лисән“ — телнең алгы өлеше катнаша. Төгәлрәк әйткәндә, „рәъсуль-лисән“ — тел очының иң алгы өлеше өске алгы тешләр артындагы казнага тия. Гуннә „әл-хәйшүм“дә — борын куышлыгында яңгырый."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Тел очы — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ر", "«طرف اللسان» («тарафуль-лисән») — тел башы (тел очы), ә «ظهر اللسان» («захруль-лисән») — аның алгы өске өлеше. Ра авазы «захруль-лисән» белән алгы өске теш казналары арасыннан чыга. Уртада һава өчен тар ачыклык кала."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Тел очы — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ط، د، ت", "Тел очы һәм өске алгы тешләрнең тамырлары. Безнең әсбаптан:  Та (ط), Дәл (د) һәм Тә (ت) хәрефләрендә тел очы бер үк урынга тия. Калын Та әйтелгәндә тел тамыры күтәрелә."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Тел очы — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ص، ز، س", "Тел очы һәм аскы алгы тешләрнең эчке өслегенең аскы өлеше. Безнең әсбаптан:  Тел очының иң алгы өлеше — «ра’суль-лисан» («رَأْسُ اللِّسَانِ») — аскы алгы тешләрнең эчке нигезе янында тора. Калын Садта тел тамыры күтәрелә."], ["", "Тел — Әл-Лисан («اللِّسَانُ»)", "Тел очы — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ظ، ذ، ث", "Тел очы һәм өске алгы тешләрнең очлары. Безнең әсбаптан:  Тел очы — «тарафуль-лисан» («طَرَفُ اللِّسَانِ») — һәм аның өске йөзе — «захруль-лисан» («ظَهْرُ اللِّسَانِ») — өске алгы тешләрнең кырыена җиңелчә тия; тел очы тешләр арасыннан аз гына алга чыга. Калын За (ظ) әйтелгәндә тел тамыры күтәрелә."], ["4", "Иреннәр — Әш-Шәфәтән («الشَّفَتَانِ»)", "Иреннең эчке ягы — Батнуш-шәфа («بَاطِنُ الشَّفَةِ»)", "ف", "Аскы иреннең эчке ягы һәм өске алгы тешләрнең очлары. Безнең әсбаптан:  Фә (ف) әйтелгәндә өске алгы тешләрнең очлары аскы иреннең эчке ягына җиңелчә генә тия; иреннәр ачык кала."], ["", "Иреннәр — Әш-Шәфәтән («الشَّفَتَانِ»)", "Ике ирен — Әш-Шәфәтән («الشَّفَتَانِ»)", "و (мәддия түгел)، ب، م", "Вау әйтелгәндә иреннәр якыная һәм түгәрәкләнә; Бә белән Мимдә иреннәр ябыла."], ["5", "Борын куышлыгы — Әл-Хәйшүм («الْخَيْشُومُ»)", "—", "Гуннә («الْغُنَّةُ»)", "Борын куышлыгы; Гуннә Нун һәм Мим хәрефләренә кушыла."]], "ru": [["№", "Общая область", "Частный махрадж", "Буквы", "Точное место образования звука"], ["1", "Полость рта и горла — Аль-Джауф («الْجَوْفُ»)", "—", "ا، و، ي — буквы маддия", "Свободное пространство рта и горла."], ["2", "Горло — Аль-Хальк («الْحَلْقُ»)", "Самая дальняя часть горла — Аксаль-хальк («أَقْصَى الْحَلْقِ»)", "ء، هـ", "Область голосовых связок."], ["", "Горло — Аль-Хальк («الْحَلْقُ»)", "Средняя часть горла — Васатуль-хальк («وَسَطُ الْحَلْقِ»)", "ع، ح", "Область надгортанника — лисануль-мизмар («لِسَانُ الْمِزْمَارِ»). Из нашего пособия:  Для Хә мизмар приближается к задней стенке горла; остаётся небольшой проход для воздуха."], ["", "Горло — Аль-Хальк («الْحَلْقُ»)", "Ближняя к ротовой полости часть горла — Адналь-хальк («أَدْنَى الْحَلْقِ»)", "غ، خ", "Область корня языка — джазруль-лисан («جَذْرُ اللِّسَانِ»). Из нашего пособия:  При Гайн мизмар приближается к задней стенке горла, а корень языка поднимается. При Ха корень языка тоже поднят; для воздуха сохраняется проход."], ["3", "Язык — Аль-Лисан («اللِّسَانُ»)", "Самая задняя часть языка — Аксаль-лисан («أَقْصَى اللِّسَانِ»)", "ق", "Самая задняя часть языка и соответствующий ей участок мягкого верхнего нёба — аль-ханак аль-ляхми («الْحَنَكُ اللَّحْمِيُّ»). Из нашего пособия:  При Каф (ق) корень языка поднимается и прижимается к мягкому нёбу."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Самая задняя часть языка — Аксаль-лисан («أَقْصَى اللِّسَانِ»)", "ك", "Самая задняя часть языка и соответствующий ей участок верхнего нёба в твёрдой и мягкой областях вместе — аль-ханак аль-азми ва-ль-ляхми («الْحَنَكُ الْعَظْمِيُّ وَاللَّحْمِيُّ»). Из нашего пособия:  При Кяф (ك) самая задняя часть языка прижимается к участку твёрдого нёба рядом с мягким."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Середина языка — Васатуль-лисан («وَسَطُ اللِّسَانِ»)", "ج، ش، ي (не маддия)", "Середина языка и соответствующий ей участок верхнего нёба. Из нашего пособия:  Васатуль-лисан («وَسَطُ اللِّسَانِ»): при Джим середина языка плотно смыкается с нёбом; при Шин остаётся щель для воздуха; при Йа она приподнимается без смыкания."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Боковой край языка — Хаффатуль-лисан («حَافَّةُ اللِّسَانِ»)", "ض", "Правый или левый боковой край языка либо оба края вместе и соответствующие им верхние коренные зубы. Из нашего пособия:  У Дад работают дальняя часть бокового края — «акса хаффатиль-лисан» («أَقْصَى حَافَّةِ اللِّسَانِ») — и средняя часть — «васат хаффатиль-лисан» («وَسَطُ حَافَّةِ اللِّسَانِ»). Кончик языка лишь слегка касается нёба; корень языка поднят."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Боковой край языка — Хаффатуль-лисан («حَافَّةُ اللِّسَانِ»)", "ل", "Буква Лям образуется при касании передней частью бокового края языка — «أدنى حافة اللسان» («адна хаффати-ль-лисан») — дёсен восьми верхних передних зубов. Воздух выходит по обеим сторонам языка. При произнесении Лям не прижимаем язык слишком сильно."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Кончик языка — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ن", "В образовании буквы Нун участвует „тарафуль-лисан“ — передняя часть языка. Точнее, „ра’суль-лисан“ — самый передний участок кончика языка касается десны за верхними передними зубами. Гунна звучит в „аль-хайшум“ — носовой полости."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Кончик языка — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ر", "«طرف اللسان» («тарафуль-лисан») — кончик языка, а «ظهر اللسان» («захруль-лисан») — его передняя верхняя поверхность. Звук Ра выходит между передней верхней поверхностью кончика языка и дёснами верхних передних зубов. Посередине остаётся небольшой проход для воздуха."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Кончик языка — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ط، د، ت", "Кончик языка и основания верхних передних резцов. Из нашего пособия:  У Та (ط) и у Даль (د), Тә (ت) место касания кончика языка одинаковое. При твёрдой Та корень языка поднимается."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Кончик языка — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ص، ز، س", "Кончик языка и нижняя часть внутренней поверхности нижних передних резцов. Из нашего пособия:  Самая передняя часть кончика — «ра’суль-лисан» («رَأْسُ اللِّسَانِ») — находится у внутреннего основания нижних резцов. При твёрдой Сад корень языка поднят."], ["", "Язык — Аль-Лисан («اللِّسَانُ»)", "Кончик языка — Тарафуль-лисан («طَرَفُ اللِّسَانِ»)", "ظ، ذ، ث", "Кончик языка и кончики верхних передних резцов. Из нашего пособия:  Кончик — «тарафуль-лисан» («طَرَفُ اللِّسَانِ») — и его верхняя поверхность — «захруль-лисан» («ظَهْرُ اللِّسَانِ») слегка касаются края верхних резцов; кончик немного выходит между зубами. При твёрдой За (ظ) корень языка поднимается."], ["4", "Губы — Аш-Шафатан («الشَّفَتَانِ»)", "Внутренняя сторона губы — Батнуш-шафа («بَاطِنُ الشَّفَةِ»)", "ف", "Внутренняя сторона нижней губы и кончики верхних передних резцов. Из нашего пособия:  При Фа (ف) кончики верхних резцов лишь слегка касаются внутренней стороны нижней губы; губы остаются открытыми." function renderExtras(){
