<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063c48">
  <meta name="description" content="Тәҗвид 3 — углублённый курс. Все готовые уроки на русском и татарском языках.">
  <title>Тәҗвид 3 · Уроки курса</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="course-home.css">
</head>
<body>
  <header class="masthead" id="top">
    <img class="cover" src="tajwid3-cover.png" alt="Тәҗвид 3 — орнаментальная обложка курса">
    <div class="masthead__inner">
      <div class="language-switch" role="group" aria-label="Язык / Тел">
        <button type="button" id="ru-button" class="active" aria-pressed="true">Русский</button>
        <button type="button" id="tt-button" aria-pressed="false">Татарча</button>
      </div>
      <div class="lesson-heading course-heading">
        <div class="eyebrow" id="course-kicker">УГЛУБЛЁННЫЙ КУРС</div>
        <h1 id="course-title">Уроки таджвида</h1>
        <p id="course-subtitle">Выберите тему. Все готовые уроки собраны здесь по порядку.</p>
      </div>
    </div>
  </header>
  <main class="course-main">
    <div class="course-intro">
      <div class="chapter-kicker" id="course-list-kicker">НАЧНИТЕ С ПЕРВОГО УРОКА</div>
      <h2 id="course-list-title">Содержание курса</h2>
      <p id="course-list-description">Откройте карточку урока, чтобы перейти к его материалу.</p>
    </div>
    <nav class="course-list" id="course-list" aria-label="Уроки курса"></nav>
  </main>
  <footer class="footer">
    <div class="footer__ornament" aria-hidden="true">✦</div>
    <p id="course-footer">Новые уроки будут появляться здесь по мере подготовки.</p>
    <a href="#top" id="top-link">К началу ↑</a>
  </footer>
  <script src="course-home.js"></script>
</body>
</html>
